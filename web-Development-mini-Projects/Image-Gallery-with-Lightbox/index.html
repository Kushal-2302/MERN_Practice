<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery with Lightbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Image Gallery</h1>
    <div class="gallery">
      <img src="./images/img1.jfif" alt="Gallery Image 1">
      <img src="./images/img2.jfif" alt="Gallery Image 2">
      <img src="./images/img3.jfif" alt="Gallery Image 3">
      <img src="./images/img4.jfif" alt="Gallery Image 4">
      <img src="./images/img5.jfif" alt="Gallery Image 5">
      <img src="./images/img6.jfif" alt="Gallery Image 6">
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-content" id="lightboxImg">
    <div id="caption"></div>
    <button id="prevBtn">⟨ Prev</button>
    <button id="nextBtn">Next ⟩</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
